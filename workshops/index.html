<style>
  :root{
    --green-950:#04301F; --green-900:#063D24; --green-800:#0B4A2C; --green-700:#106D38;
    --green-600:#0C8F41; --green-500:#0CAD4B; --green-400:#38B048; --gold:#B87838; --blue:#0870B8;
    --ink:#16241C; --ink-soft:#4A5A50; --bg:#FFFFFF; --bg-soft:#F7F9F7; --border:#E3EAE4;
    --shadow:0 10px 40px rgba(6,61,36,0.10); --radius:16px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{ margin:0; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; }
  html[lang="ar"] body{ font-family:'Tajawal','Segoe UI',sans-serif; }
  html[lang="en"] body{ font-family:'Barlow','Segoe UI',sans-serif; }
  img{ max-width:100%; display:block; }
  a{ color:inherit; }
  .container{ width:100%; max-width:1000px; margin:0 auto; padding:0 24px; }
  .site-header{ position:sticky; top:0; z-index:100; background:rgba(255,255,255,0.92); backdrop-filter:blur(10px); border-bottom:1px solid var(--border); }
  .header-inner{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding:12px 24px; max-width:1180px; margin:0 auto; direction:ltr; }
  .brand{ display:flex; align-items:center; gap:14px; min-width:0; }
  .brand img{ height:42px; width:auto; flex-shrink:0; }
  .header-actions{ display:flex; align-items:center; gap:16px; flex-shrink:0; }
  .vision-badge{ height:36px; width:auto; flex-shrink:0; }
  .lang-toggle{ display:flex; align-items:center; background:var(--bg-soft); border:1px solid var(--border); border-radius:999px; padding:3px; flex-shrink:0; }
  .lang-toggle button{ border:none; background:transparent; padding:7px 16px; border-radius:999px; font-size:13px; font-weight:700; color:var(--ink-soft); transition:all .25s ease; font-family:inherit; cursor:pointer; }
  .lang-toggle button.active{ background:var(--green-700); color:#fff; box-shadow:0 4px 12px rgba(16,109,56,0.3); }
  @media (max-width:480px){ .vision-badge{ display:none; } }

  .back-link{
    display:inline-flex; align-items:center; gap:8px; margin:32px 0 0;
    font-size:14px; font-weight:700; color:var(--green-700); text-decoration:none;
  }
  .back-link .arrow{ font-size:16px; }
  html[dir="rtl"] .back-link .arrow{ transform:scaleX(-1); }

  .workshop-hero{ padding:28px 0 8px; }
  .workshop-badge{
    display:inline-flex; background:var(--bg-soft); border:1px solid var(--border);
    border-radius:999px; padding:8px 20px; font-size:13px; font-weight:800; color:var(--green-700); margin-bottom:18px;
  }
  .workshop-hero h1{ font-size:clamp(26px,4vw,38px); font-weight:900; color:var(--green-900); margin:0 0 12px; line-height:1.3; }

  .workshop-body{ padding:24px 0 90px; }

  /* ===== Workshops columns (from main site) ===== */
  .workshops-columns{ display:grid; grid-template-columns:1fr 1fr; gap:32px; }
  .workshops-col h3{
    display:flex; align-items:center; gap:10px; font-size:16px; font-weight:800;
    color:var(--green-900); margin:0 0 18px;
  }
  .workshops-col h3 .dot{ width:10px; height:10px; border-radius:50%; flex-shrink:0; background:var(--green-500); }
  .workshops-col.upcoming h3 .dot{ background:var(--gold); }
  .workshop-item{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    background:var(--bg-soft); border:1px solid var(--border); border-radius:12px;
    padding:16px 20px; margin-bottom:12px; text-decoration:none;
  }
  a.workshop-item{ transition:border-color .2s ease, box-shadow .2s ease, transform .2s ease; }
  a.workshop-item:hover{ border-color:var(--green-500); box-shadow:var(--shadow); transform:translateY(-2px); }
  .workshop-item .title-wrap{ display:flex; align-items:center; gap:10px; }
  .workshop-item .title{ font-size:14.5px; font-weight:700; color:var(--ink); }
  .workshop-item .arrow{ color:var(--green-600); font-size:16px; flex-shrink:0; }
  html[dir="rtl"] .workshop-item .arrow{ transform:scaleX(-1); }
  .workshop-item .date{
    flex-shrink:0; font-size:12.5px; font-weight:800; color:var(--green-700);
    background:#fff; border:1px solid var(--border); padding:6px 14px; border-radius:999px; white-space:nowrap;
  }
  .workshops-col.upcoming .workshop-item{ background:rgba(184,120,56,0.06); }
  .workshops-col.upcoming .workshop-item .date{ color:var(--gold); border-color:rgba(184,120,56,0.3); }
  @media (max-width:760px){ .workshops-columns{ grid-template-columns:1fr; gap:28px; } }

  .site-footer{ background:var(--green-950); color:#EAF3EC; padding:40px 0 24px; text-align:center; }
  .site-footer .footer-title{ font-size:15px; font-weight:800; margin-bottom:6px; }
  .site-footer .footer-copy{ font-size:12px; color:#7FA08D; margin-top:14px; }
</style>
</head>
<body>

<header class="site-header">

<script>
(function(){
  var toggleBtnAr = document.getElementById('btn-ar');
  var toggleBtnEn = document.getElementById('btn-en');
  var html = document.documentElement;

  function setLang(lang){
    html.setAttribute('lang', lang);
    html.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
    toggleBtnAr.classList.toggle('active', lang === 'ar');
    toggleBtnEn.classList.toggle('active', lang === 'en');
    document.querySelectorAll('[data-ar]').forEach(function(el){
      var text = lang === 'ar' ? el.getAttribute('data-ar') : el.getAttribute('data-en');
      if(text !== null){ el.textContent = text; }
    });
    try{ localStorage.setItem('efs_lang', lang); }catch(e){}
  }

  toggleBtnAr.addEventListener('click', function(){ setLang('ar'); });
  toggleBtnEn.addEventListener('click', function(){ setLang('en'); });

  var saved = null;
  try{ saved = localStorage.getItem('efs_lang'); }catch(e){}
  setLang(saved === 'en' ? 'en' : 'ar');
})();
</script>
